[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rentdesk"
version = "0.1.0"
description = "AI-powered WhatsApp assistant for rental bookkeeping and tenant queries"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # HTTP client (async + sync)
    "httpx>=0.27.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # AI / LLM
    "openai>=1.40.0",           # GPT-4.1 + Whisper STT
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "litellm>=1.44.0",          # Model-agnostic LLM calls


    # Google Sheets OAuth
    "google-auth>=2.32.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # Crypto / Security
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Audio / voice processing
    "pydub>=0.25.1",            # ogg->wav conversion

    # Utilities
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "tenacity>=8.5.0",          # Retry logic
    "structlog>=24.4.0",        # Structured logging
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
